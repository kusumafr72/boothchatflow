server {
    listen 80;
    server_name booth.chatflow.id www.booth.chatflow.id;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name booth.chatflow.id www.booth.chatflow.id;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/booth.chatflow.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booth.chatflow.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root directory for static files
    root /path/to/your/project/.next;

    # Handle Next.js static files
    location /_next/static {
        alias /path/to/your/project/.next/static;
        expires 365d;
        access_log off;
    }

    # Handle Next.js public files
    location /public {
        alias /path/to/your/project/public;
        expires 365d;
        access_log off;
    }

    # Handle Next.js pages and API routes
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle API routes
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Block access to development files
    location ~ /\.next/development {
        deny all;
    }
} 